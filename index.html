<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برج عبس ٤٠٤</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2efe9;--fg:#1d2433;--muted:#6b7385;--peg:#8a7a63;--base:#c9bfae;--hl:#1d2433;--card:#e8e3d9;
--d1:#e4572e;--d2:#f3a712;--d3:#6aa84f;--d4:#29a2a8;--d5:#3d6fd1;--d6:#8a55c9;--d7:#d44a8a;--d8:#b5651d;--d9:#7c8ba8;--d10:#9bc53d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14181f;--fg:#eef0f5;--muted:#9099ad;--peg:#4b5568;--base:#2a3140;--hl:#eef0f5;--card:#1d232e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14181f;--fg:#eef0f5;--muted:#9099ad;--peg:#4b5568;--base:#2a3140;--hl:#eef0f5;--card:#1d232e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Tajawal",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
main{width:100%;max-width:560px;flex:1;display:flex;flex-direction:column;padding:16px}
h1{font-size:28px;margin:4px 0 2px;font-weight:800}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.stat{font-size:15px;color:var(--muted)}.stat b{color:var(--fg);font-size:20px}
.sel{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.sel button{padding:8px 11px}
button{font:inherit;border:0;border-radius:10px;background:var(--card);color:var(--fg);padding:8px 14px;cursor:pointer;font-weight:700}
button:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
button.on{background:var(--fg);color:var(--bg)}
#board{flex:1;min-height:300px;max-height:420px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;direction:ltr;align-items:end}
.peg{position:relative;height:100%;display:flex;flex-direction:column-reverse;align-items:center;padding-bottom:14px;border-radius:14px;cursor:pointer;background:transparent;border:0}
.peg::before{content:"";position:absolute;bottom:14px;top:18px;width:8px;border-radius:4px;background:var(--peg)}
.peg::after{content:"";position:absolute;bottom:0;left:4%;right:4%;height:14px;border-radius:7px;background:var(--base)}
.peg.sel-peg::after{background:var(--hl)}
.disc{position:relative;z-index:1;height:26px;margin-top:3px;border-radius:13px;transition:transform .15s}
.disc.lift{transform:translateY(-14px)}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.disc{transition:none}}
.win{font-size:28px;font-weight:800;margin-bottom:4px}
#msg{min-height:52px;text-align:center;margin-top:14px;font-weight:700;font-size:17px}
.act{display:flex;justify-content:center;gap:10px;margin-top:4px}
</style>
</head>
<body>
<main>
<h1>برج عبس ٤٠٤</h1>
<p class="sub">انقل كل الأقراص من العمود الأول إلى الأخير. لا تضع قرصاً كبيراً فوق قرص أصغر.</p>
<div class="bar">
  <div class="stat">الحركات <b id="mv">0</b> · الأقل <b id="best">7</b></div>
  <div class="sel" id="sel"></div>
</div>
<div id="board"></div>
<div id="msg">اضغط على عمود لاختيار القرص العلوي، ثم اضغط على العمود الهدف.</div>
<div class="act"><button id="undo">تراجع</button><button id="reset">إعادة</button><button id="snd">🔊 الصوت</button></div>
</main>
<script>
var n=3,pegs,sel=null,moves=0,hist=[],done=false;
var cols=["--d1","--d2","--d3","--d4","--d5","--d6","--d7","--d8","--d9","--d10"];
var board=document.getElementById("board"),msg=document.getElementById("msg");

function init(){
 pegs=[[],[],[]];
 for(var i=n;i>=1;i--)pegs[0].push(i);
 sel=null;moves=0;hist=[];done=false;
 msg.textContent="اضغط على عمود لاختيار القرص العلوي، ثم اضغط على العمود الهدف.";
 render();
}

function render(){
 board.innerHTML="";
 pegs.forEach(function(p,i){
  var b=document.createElement("button");
  b.className="peg"+(sel===i?" sel-peg":"");
  b.setAttribute("aria-label","العمود "+(i+1));
  p.forEach(function(d,k){
   var e=document.createElement("div");
   e.className="disc"+(sel===i&&k===p.length-1?" lift":"");
   e.style.width=(22+d*(70/n))+"%";
   e.style.height=(n>7?"20px":"26px");
   e.style.background="var("+cols[d-1]+")";
   b.appendChild(e);
  });
  b.onclick=function(){tap(i,b)};
  board.appendChild(b);
 });
 document.getElementById("mv").textContent=moves;
 document.getElementById("best").textContent=Math.pow(2,n)-1;
}

function tap(i,el){
 startAudio();
 if(done)return;
 if(sel===null){if(pegs[i].length){sel=i;render();}return;}
 if(sel===i){sel=null;render();return;}
 var from=pegs[sel],to=pegs[i],d=from[from.length-1];
 if(to.length&&to[to.length-1]<d){
  el.classList.add("shake");
  msg.textContent="غير مسموح: لا تضع قرصاً كبيراً فوق قرص أصغر.";
  sel=null;setTimeout(render,300);return;
 }
 from.pop();to.push(d);hist.push([sel,i]);moves++;blip();
 sel=null;msg.textContent="";render();
 if(pegs[2].length===n){
  done=true;winSound();
  var m=Math.pow(2,n)-1;
  msg.innerHTML='<div class="win">كفو يا رشيدي ياحول يا عبس 🎉</div>'+(moves===m?"أنهيتها بأقل عدد حركات ممكن!":"أنهيتها في "+moves+" حركة. الأقل الممكن "+m+".");
 }
}

document.getElementById("undo").onclick=function(){
 if(!hist.length||done)return;
 var h=hist.pop();
 pegs[h[0]].push(pegs[h[1]].pop());
 moves--;sel=null;render();
};
document.getElementById("reset").onclick=init;

/* الصوت */
var ac=null,soundOn=true;

function tone(f,t,d,v,type){
 var o=ac.createOscillator(),g=ac.createGain();
 o.type=type||"sine";o.frequency.value=f;
 g.gain.setValueAtTime(0.0001,t);
 g.gain.exponentialRampToValueAtTime(v,t+0.03);
 g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 o.connect(g);g.connect(ac.destination);
 o.start(t);o.stop(t+d+0.05);
}
function startAudio(){
 if(!soundOn)return;
 try{
  if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==="suspended")ac.resume();
 }catch(e){}
}
function blip(){
 if(!soundOn||!ac)return;
 try{tone(392,ac.currentTime,0.15,0.08,"triangle");}catch(e){}
}
function winSound(){
 if(!soundOn||!ac)return;
 try{
  [523.25,659.25,783.99,1046.5,1318.5,1568].forEach(function(f,i){
   tone(f,ac.currentTime+0.1+i*0.12,0.7,0.12,"triangle");
  });
  tone(1046.5,ac.currentTime+0.9,1.6,0.1,"sine");
 }catch(e){}
}
document.getElementById("snd").onclick=function(){
 soundOn=!soundOn;
 this.textContent=soundOn?"🔊 الصوت":"🔇 مكتوم";
 if(soundOn)startAudio();
};

/* اختيار عدد الأقراص */
var s=document.getElementById("sel");
[3,4,5,6,7,8,9,10].forEach(function(k){
 var b=document.createElement("button");
 b.textContent=k;
 b.setAttribute("aria-label",k+" أقراص");
 b.className=k===n?"on":"";
 b.onclick=function(){
  n=k;
  [].forEach.call(s.children,function(c){c.className=""});
  b.className="on";
  init();
 };
 s.appendChild(b);
});

init();
</script>
</body>
</html>
